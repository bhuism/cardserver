name: CardServer

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/stream
            ghcr.io/${{ github.repository }}/gameengine
            ghcr.io/${{ github.repository }}/aiplayer
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build image
        run: |
          mvn -B -ntp -T 1C clean install spring-boot:build-image -pl api,stream,gameengine,aiplayer -am '-Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository }}/${project.artifactId}:latest-${{ matrix.arch }}'

      - name: Code quality
        if: matrix.arch == 'amd64'
        run: |
          mvn -B -ntp -T 1C org.apache.maven.plugins:maven-checkstyle-plugin:check com.github.spotbugs:spotbugs-maven-plugin:check -pl api,stream,gameengine,aiplayer -am

      - name: Push
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository }}/api:latest-${{ matrix.arch }}
          docker push ghcr.io/${{ github.repository }}/stream:latest-${{ matrix.arch }}
          docker push ghcr.io/${{ github.repository }}/gameengine:latest-${{ matrix.arch }}
          docker push ghcr.io/${{ github.repository }}/aiplayer:latest-${{ matrix.arch }}
  manifest:
    name: Push Multi-Arch Manifest
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push Multi-Arch Manifests
        run: |
          for module in api stream gameengine aiplayer; do
            docker buildx imagetools create -t ghcr.io/${{ github.repository }}/$module:latest \
              ghcr.io/${{ github.repository }}/$module:latest-amd64 \
              ghcr.io/${{ github.repository }}/$module:latest-arm64
          done

  rollout-restart:
    name: Rollout Restart
    needs: manifest
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Rollout Restart Deployments
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: -n cardserver rollout restart deployment cardserver-api cardserver-aiplayer cardserver-gameengine cardserver-stream
