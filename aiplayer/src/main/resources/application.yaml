server:
  compression:
    enabled: true
  forward-headers-strategy: framework
  shutdown: graceful
  port: 8084
logging:
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr(${spring.application.name:-}[${HOSTNAME}]){yellow} %clr([%15.15t]){faint} %clr(${LOG_CORRELATION_PATTERN:-}){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  level:
    ROOT: warn
    nl.appsource: info
spring:
  lifecycle:
    timeout-per-shutdown-phase: 2s
  main:
    web-application-type: reactive
  application:
    name: "Ai Player  "
  jackson:
    default-property-inclusion: non_absent
    time-zone: Europe/Amsterdam
  output:
    ansi:
      enabled: ALWAYS
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
          max-age: 0
management:
  endpoint:
    env:
      show-values: always
    info:
      access: read_only
    health:
      access: read_only
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  server:
    port: 9084
    ssl:
      enabled: false
    add-application-context-header: true
